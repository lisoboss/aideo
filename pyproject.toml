[tool.uv.workspace]
members = [
    "packages/*",
    "tools/*",
]
exclude = [
    "packages/aideo-ipad",
]

[tool.uv.sources]
aideo-serv = { workspace = true }
aideo-cli = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-httpx>=0.36",
    "httpx2",
    "mypy>=2.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.bandit]
skips = ["B101", "B104"]
exclude_dirs = [".venv", "venv", "tests", "packages/*/tests"]
