[project]
name = "aideo-runtime"
version = "0.1.0"
description = "Aideo — aggregated local inference runtime (T2V, STT, LLM, vision)"
readme = "README.md"
authors = [
    { name = "lisoboss", email = "37949544+lisoboss@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138",
    "uvicorn>=0.49",
    "httpx>=0.28",
    "websockets>=16.0",
    "sse-starlette>=2.0",
    "faster-whisper2",
    "ltx-core[xformers]",
    "ltx-pipelines",
    "torch",
    "torchvision",
    "safetensors",
    "torchaudio",
    "nvidia-cudnn-cu13>=9.20.0.48",
    "nvidia-cublas>=13.1.1.3",
]

[project.scripts]
aideo-runtime = "aideo_runtime.server:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"
    
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
ltx-pipelines = { git = "https://github.com/lisoboss/LTX-2.git", branch = "dev", subdirectory = "packages/ltx-pipelines" }
faster-whisper2 = { git = "https://github.com/lisoboss/faster-whisper2.git" }
ltx-core = { git = "https://github.com/lisoboss/LTX-2.git", branch = "dev", subdirectory = "packages/ltx-core" }
