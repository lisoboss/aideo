[project]
name = "aideo-runtime"
version = "0.1.0"
description = "Aideo — unified AI inference runtime"
readme = "README.md"
authors = [
    { name = "lisoboss", email = "37949544+lisoboss@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aideo-models",
    "fastapi>=0.138.1",
    "httpx>=0.28",
    "sse-starlette>=3.4.5",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
]

[project.scripts]
aideo-runtime = "aideo_runtime:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
aideo-models = { workspace = true }
