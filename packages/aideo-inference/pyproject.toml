[project]
name = "ltx2-service"
version = "0.1.0"
description = "Aideo — LTX-2 inference service"
readme = "README.md"
authors = [
    { name = "lisoboss", email = "37949544+lisoboss@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138",
    "uvicorn>=0.49",
    "httpx>=0.28",
]

[project.scripts]
ltx2-server = "ltx2_service.server:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"
