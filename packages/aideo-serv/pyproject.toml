[project]
name = "aideo-serv"
version = "0.1.0"
description = "Aideo — API server"
readme = "README.md"
authors = [
    { name = "lisoboss", email = "37949544+lisoboss@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138",
    "uvicorn>=0.49",
    "pydantic-settings>=2.14",
    "aiofiles>=25",
    "websockets>=16.0",
    "httpx>=0.28",
]

[project.scripts]
aideo-serv = "aideo_serv:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"
